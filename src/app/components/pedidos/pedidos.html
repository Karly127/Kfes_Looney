<div style="display: flex; min-height: 100vh;">
  <app-sidebar></app-sidebar> 

  <div style="flex-grow: 1; padding: 20px;">
    <div class="pedidos-container" style="display: flex; gap: 20px; padding: 20px;">
      
      <!-- Sección Principal: Menú -->
      <div class="menu-section" style="flex: 2;">
        <h2>Nuevo pedido</h2>
        <p>Selecciona una mesa y agrega productos a la orden</p>
        
        <!-- Selector de Mesas -->
        <div class="mesas-list" style="display: flex; gap: 10px; margin-bottom: 20px;">
          <span style="font-weight: bold;">Mesa</span>
          <button *ngFor="let mesa of mesas" 
                  (click)="seleccionarMesa(mesa)"
                  [style.background]="mesaSeleccionada === mesa ? 'var(--primary-yellow)' : '#fff'"
                  style="border: 1px solid #ddd; border-radius: 5px; padding: 5px 15px;">
            {{mesa}}
          </button>
          <span *ngIf="mesaSeleccionada" style="background: #FDEBD0; padding: 5px; border-radius: 5px; font-size: 0.8em;">
            Mesa {{mesaSeleccionada}} - 2 personas
          </span>
        </div>

        <!-- Categorías -->
        <div class="categorias-list" style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button *ngFor="let cat of categorias" 
                  (click)="seleccionarCategoria(cat)"
                  [style.background]="categoriaActiva === cat ? '#333' : '#fff'"
                  [style.color]="categoriaActiva === cat ? '#fff' : '#333'"
                  style="border: 1px solid #ddd; border-radius: 20px; padding: 5px 15px;">
            {{cat}}
          </button>
        </div>

        <!-- Grid de Productos -->
        <div class="productos-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
          <div class="producto-card" *ngFor="let prod of productos" style="background: #fff; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <div style="background: var(--bg-light); height: 80px; border-radius: 8px; margin-bottom: 10px;"></div>
            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px;">
              <span>{{prod.nombre}}</span>
              <span>${{prod.precio}}</span>
            </div>
            <button class="btn-secundario" (click)="agregarProducto(prod)" style="width: 100%;">+ Agregar</button>
          </div>
        </div>
      </div>

      <!-- Resumen de Orden -->
      <div class="orden-section" style="flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Orden · Mesa {{mesaSeleccionada}}</h3>
          <span style="background: #FDEBD0; padding: 5px 10px; border-radius: 15px; font-size: 0.8em;">Borrador</span>
        </div>
        
        <div *ngFor="let item of orden" style="display: flex; justify-content: space-between; margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">
          <span><strong style="color: #D4AC0D;">{{item.cantidad}}x</strong> {{item.nombre}}</span>
          <strong>${{item.total}}</strong>
        </div>

        <div style="margin-top: 20px;">
          <label style="font-size: 0.9em; font-weight: bold;">Nota para cocina</label>
          <input type="text" [(ngModel)]="notaComanda" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 5px; background: var(--bg-light);">
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 1.5em; font-weight: bold; margin: 30px 0;">
          <span>Total</span>
          <span>${{totalOrden}}</span>
        </div>

        <button class="btn-primario" style="width: 100%;">Enviar a recepción</button>
      </div>
    </div>

  </div>  
</div>
